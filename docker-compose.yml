version: '3.9'

services:
  api:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      - db
    command: npm run dev
    volumes:
      - ./:/app
      - /app/node_modules
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: finance_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
