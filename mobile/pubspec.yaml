name: finance_app
description: A finance management app scaffolded with clean architecture.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.5
  flutter_riverpod: ^2.4.6
  dio: ^5.3.3
  go_router: ^12.1.1
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.1
  intl: ^0.18.1
  json_annotation: ^4.9.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.2
  test: ^1.24.9

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
